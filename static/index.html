<!DOCTYPE html>
<html lang="ru">
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quadratic Solver</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 420px;
      margin: 60px auto;
      padding: 0 16px;
      color: #222;
    }
    h1 { font-size: 1.4rem; }
    .equation { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 1.1rem; }
    .equation input { width: 64px; padding: 6px; font-size: 1rem; }
    button { margin-top: 16px; padding: 8px 20px; font-size: 1rem; cursor: pointer; }
    .result { margin-top: 20px; font-size: 1.1rem; }
    .error { color: #c0392b; }
  </style>
</head>
<body>
  <h1>Квадратное уравнение</h1>

  <form action="/" method="get">
    <div class="equation">
      <input name="a" type="number" step="any" value="{{a}}" required> x² +
      <input name="b" type="number" step="any" value="{{b}}" required> x +
      <input name="c" type="number" step="any" value="{{c}}" required> = 0
    </div>
    <button type="submit">Решить</button>
  </form>

  <div class="result">{{result}}</div>
</body>
</html>
